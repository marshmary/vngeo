# GitHub Actions E2E gate — generated via bmad-testarch-ci
# Stack: frontend (React+Vite+TS) | Framework: Playwright | Target: chromium
#
# Boots a CI-local Supabase (docker compose) with per-run keys + the one-shot
# seed (admin@vngeo.local / user@vngeo.local), then runs the read suite and the
# CRUD write suite against it. CRUD is chromium-only by design (write paths are
# browser-agnostic; cross-browser coverage lives in the read suite).
#
# Local-dev seeded-user credentials below are NOT secrets — they exist only in
# the disposable CI-local Supabase and are reset every run.

name: E2E Tests

on:
  push:
    branches: [main, test/e2e-init]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run lint

  e2e:
    name: Playwright E2E (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TEST_ENV: local
      SUPABASE_URL: http://localhost:8000
      # Seeded local-Supabase users (local-dev only; reset every CI run)
      TEST_ADMIN_EMAIL: admin@vngeo.local
      TEST_ADMIN_PASSWORD: AdminPass123!
      TEST_USER_EMAIL: user@vngeo.local
      TEST_USER_PASSWORD: UserPass123!
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      # ── Local Supabase: per-run keys + auto-seed on first boot ──
      - name: Boot local Supabase
        working-directory: supabase
        run: |
          rm -f .env            # ensure setup script doesn't prompt to overwrite
          bash setup-local-supabase.sh
          docker compose up -d --wait
          # Surface the per-run keys to the test steps (teardown client + seed poll)
          echo "SUPABASE_SERVICE_ROLE_KEY=$(grep '^SERVICE_ROLE_KEY=' .env | cut -d= -f2-)" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$(grep '^ANON_KEY=' .env | cut -d= -f2-)" >> "$GITHUB_ENV"

      - name: Wait for auth + seeded users
        run: |
          # 1) GoTrue health
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/auth/v1/health || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          # 2) Seed service completed = seeded admin can log in
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST "http://localhost:8000/auth/v1/token?grant_type=password" \
              -H "apikey=$SUPABASE_ANON_KEY" -H "Content-Type: application/json" \
              -d '{"email":"admin@vngeo.local","password":"AdminPass123!"}' || true)
            if [ "$code" = "200" ]; then echo "Seed ready (admin login OK)"; exit 0; fi
            sleep 2
          done
          echo "Supabase seed did not become ready in time"; exit 1

      # setup-local-supabase.sh wrote root .env.local → the dev server (Playwright
      # webServer) serves the app pointed at local Supabase.
      - name: Run read suite (chromium)
        run: npx playwright test --project=chromium
        env:
          TEST_RUN_CRUD_WRITE: '0'   # CRUD specs skip; pure read baseline

      - name: Run CRUD write suite (chromium)
        run: npm run test:e2e:crud   # forces TEST_RUN_CRUD_WRITE=1, scopes to CRUD specs

      - name: Upload report + artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Teardown Supabase
        if: always()
        working-directory: supabase
        run: docker compose down -v || true

      - name: Job summary
        if: always()
        run: |
          echo "## E2E (chromium)" >> "$GITHUB_STEP_SUMMARY"
          echo "Read suite + CRUD write suite against CI-local Supabase." >> "$GITHUB_STEP_SUMMARY"
          echo "Artifacts attached on failure (report + traces)." >> "$GITHUB_STEP_SUMMARY"
